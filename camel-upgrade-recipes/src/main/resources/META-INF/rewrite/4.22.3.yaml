#####
# Rules coming from https://camel.apache.org/manual/camel-4x-upgrade-guide-4_22.html
# Specifically changes introduced in 4.22.3 (upgrading from 4.22.2 to 4.22.3),
# checked against the camel-4.22.3 tag (the guide on main lists more items than the tag ships).
#
# Referenced from org.apache.camel.upgrade.Camel422LTSMigrationRecipe (4.22LTS.yaml) and from the 4.24
# migration recipe (Camel 4.23.0 does not have these changes), per RECIPE-CONVENTIONS.md.
#####

#####
# Update the Camel project from 4.22.2 to 4.22.3
#####
---
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel422_3.CamelMigrationRecipe
displayName: Migrates `camel 4.22.2` application to `camel 4.22.3`
description: Migrates `camel 4.22.2` application to `camel 4.22.3`.
recipeList:
  ## inherited from patch recipe: the openstack Swift header rename also ships in 4.18.6
  - org.apache.camel.upgrade.camel418_6.upgradeOpenstackSwiftHeaders
  ## defined here
  - org.apache.camel.upgrade.camel422_3.upgradePubNubOverrideChannel
---
## https://github.com/apache/camel/blob/main/docs/user-manual/modules/ROOT/pages/camel-4x-upgrade-guide-4_22.adoc#camel-pubnub---the-producer-uses-its-configured-channel
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel422_3.upgradePubNubOverrideChannel
displayName: Migrate a set CamelPubNubChannel header to CamelPubNubOverrideChannel
description: >-
  CAMEL-25888: the pubnub producer no longer reads CamelPubNubChannel, which the consumer sets to the channel a
  message came from; a route picks another channel with CamelPubNubOverrideChannel. Renames the header only where a
  route sets it (literal, PubNubConstants.CHANNEL, Endpoint DSL pubNubChannel()); reads of the consumer header are
  left alone.
preconditions:
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: org.apache.camel
      artifactIdPattern: camel-pubnub
recipeList:
  - org.apache.camel.upgrade.camel422_3.RenameHeaderWhenSet:
      oldHeaderName: CamelPubNubChannel
      newHeaderName: CamelPubNubOverrideChannel
      constantClass: org.apache.camel.component.pubnub.PubNubConstants
      oldConstantName: CHANNEL
      newConstantName: OVERRIDE_CHANNEL
      oldHeaderNameBuilderMethod: org.apache.camel.builder.endpoint.dsl.PubNubEndpointBuilderFactory.PubNubHeaderNameBuilder pubNubChannel()
      newHeaderNameBuilderMethod: pubNubOverrideChannel
