  - org.apache.camel.upgrade.camel418_3.RenameHeaders:
      headerMappings:
        CamelRockerMQTopic: CamelRocketMQTopic
        CamelRockerMQTag: CamelRocketMQTag
        CamelRockerMQKey: CamelRocketMQKey
        CamelRockerMQOverrideTopicName: CamelRocketMQOverrideTopicName
        CamelRockerMQOverrideTag: CamelRocketMQOverrideTag
        CamelRockerMQOverrideMessageKey: CamelRocketMQOverrideMessageKey
        CamelRockerMQBrokerName: CamelRocketMQBrokerName
        CamelRockerMQQueueId: CamelRocketMQQueueId
        CamelRockerMQStoreSize: CamelRocketMQStoreSize
        CamelRockerMQQueueOffset: CamelRocketMQQueueOffset
        CamelRockerMQSysFlag: CamelRocketMQSysFlag
        CamelRockerMQBornTimestamp: CamelRocketMQBornTimestamp
        CamelRockerMQBornHost: CamelRocketMQBornHost
        CamelRockerMQStoreTimestamp: CamelRocketMQStoreTimestamp
        CamelRockerMQStoreHost: CamelRocketMQStoreHost
        CamelRockerMQMsgId: CamelRocketMQMsgId
        CamelRockerMQCommitLogOffset: CamelRocketMQCommitLogOffset
        CamelRockerMQBodyCrc: CamelRocketMQBodyCrc
        CamelRockerMQReconsumeTimes: CamelRocketMQReconsumeTimes
        CamelRockerMQPreparedTransactionOffset: CamelRocketMQPreparedTransactionOffset
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.camel.builder.endpoint.dsl.RocketMQEndpointBuilderFactory.RocketMQHeaderNameBuilder rockerMQTopic()
      newMethodName: rocketMQTopic
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.camel.builder.endpoint.dsl.RocketMQEndpointBuilderFactory.RocketMQHeaderNameBuilder rockerMQTag()
      newMethodName: rocketMQTag
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.camel.builder.endpoint.dsl.RocketMQEndpointBuilderFactory.RocketMQHeaderNameBuilder rockerMQKey()
      newMethodName: rocketMQKey
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.camel.builder.endpoint.dsl.RocketMQEndpointBuilderFactory.RocketMQHeaderNameBuilder rockerMQOverrideTopicName()
      newMethodName: rocketMQOverrideTopicName
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.camel.builder.endpoint.dsl.RocketMQEndpointBuilderFactory.RocketMQHeaderNameBuilder rockerMQOverrideTag()
      newMethodName: rocketMQOverrideTag
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.camel.builder.endpoint.dsl.RocketMQEndpointBuilderFactory.RocketMQHeaderNameBuilder rockerMQOverrideMessageKey()
      newMethodName: rocketMQOverrideMessageKey
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.camel.builder.endpoint.dsl.RocketMQEndpointBuilderFactory.RocketMQHeaderNameBuilder rockerMQBrokerName()
      newMethodName: rocketMQBrokerName
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.camel.builder.endpoint.dsl.RocketMQEndpointBuilderFactory.RocketMQHeaderNameBuilder rockerMQQueueId()
      newMethodName: rocketMQQueueId
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.camel.builder.endpoint.dsl.RocketMQEndpointBuilderFactory.RocketMQHeaderNameBuilder rockerMQStoreSize()
      newMethodName: rocketMQStoreSize
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.camel.builder.endpoint.dsl.RocketMQEndpointBuilderFactory.RocketMQHeaderNameBuilder rockerMQQueueOffset()
      newMethodName: rocketMQQueueOffset
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.camel.builder.endpoint.dsl.RocketMQEndpointBuilderFactory.RocketMQHeaderNameBuilder rockerMQSysFlag()
      newMethodName: rocketMQSysFlag
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.camel.builder.endpoint.dsl.RocketMQEndpointBuilderFactory.RocketMQHeaderNameBuilder rockerMQBornTimestamp()
      newMethodName: rocketMQBornTimestamp
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.camel.builder.endpoint.dsl.RocketMQEndpointBuilderFactory.RocketMQHeaderNameBuilder rockerMQBornHost()
      newMethodName: rocketMQBornHost
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.camel.builder.endpoint.dsl.RocketMQEndpointBuilderFactory.RocketMQHeaderNameBuilder rockerMQStoreTimestamp()
      newMethodName: rocketMQStoreTimestamp
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.camel.builder.endpoint.dsl.RocketMQEndpointBuilderFactory.RocketMQHeaderNameBuilder rockerMQStoreHost()
