## https://github.com/apache/camel/blob/main/docs/user-manual/modules/ROOT/pages/camel-4x-upgrade-guide-4_24.adoc#camel-ftp-camel-mina-sftp-camel-azure-files-camel-smb-a-readlock-the-component-does-not-implement-fails-the-consumer
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel424.removeRemoteFileReadLockOptions
displayName: Remove the removed readLock Endpoint DSL methods of the remote file components
description: >-
  CAMEL-26337: the readLock options that only the file component implements did nothing on ftp, ftps, sftp,
  mina-sftp, azure-files and smb, and their Endpoint DSL builder methods are removed. Removes the calls. The options
  in endpoint URIs still work and are left alone; an unsupported readLock value needs a manual fix.
recipeList:
  - org.openrewrite.java.RemoveMethodInvocations:
      methodPattern: org.apache.camel.builder.endpoint.dsl.FtpEndpointBuilderFactory.FtpEndpointConsumerBuilder readLockDeleteOrphanLockFiles(..)
  - org.openrewrite.java.RemoveMethodInvocations:
