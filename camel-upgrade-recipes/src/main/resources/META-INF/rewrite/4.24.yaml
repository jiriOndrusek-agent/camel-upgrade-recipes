## https://github.com/apache/camel/blob/main/docs/user-manual/modules/ROOT/pages/camel-4x-upgrade-guide-4_24.adoc#camel-core-the-activity-of-the-backlog-tracer-is-replaced-by-the-timeline-dev-console
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel424.removeBacklogTracerActivity
displayName: Remove the backlog tracer activity options
description: >-
  CAMEL-26691: the activity tracking of the backlog tracer is removed. Deletes the camel.trace.activityEnabled and
  camel.trace.activitySize options and the BacklogTracer setActivityEnabled / setActivitySize calls. The other
  removed getters and dumpActivity methods, the activity dev console and Exchange.ACTIVITY_SPAN_TAGS need a manual
  migration to the timeline dev console.
recipeList:
  - org.openrewrite.properties.DeleteProperty:
      propertyKey: camel.trace.activityEnabled
  - org.openrewrite.properties.DeleteProperty:
      propertyKey: camel.trace.activitySize
  - org.openrewrite.yaml.DeleteProperty:
      propertyKey: camel.trace.activityEnabled
  - org.openrewrite.yaml.DeleteProperty:
      propertyKey: camel.trace.activitySize
  - org.openrewrite.java.RemoveMethodInvocations:
      methodPattern: org.apache.camel.spi.BacklogTracer setActivityEnabled(boolean)
  - org.openrewrite.java.RemoveMethodInvocations:
      methodPattern: org.apache.camel.spi.BacklogTracer setActivitySize(int)
---
## https://github.com/apache/camel/blob/main/docs/user-manual/modules/ROOT/pages/camel-4x-upgrade-guide-4_24.adoc#camel-minio-the-getobjectrange-operation
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel424.migrateMinioGetObjectRange
displayName: Migrate the deprecated camel-minio getPartialObject operation to getObjectRange
description: >-
  CAMEL-25933: getPartialObject is the deprecated former name of getObjectRange. Renames the operation in endpoint
  URIs, the MinioOperations enum constant and the camel.component.minio.operation option. String values of the
  CamelMinioOperation header need a manual update.
preconditions:
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: org.apache.camel
      artifactIdPattern: camel-minio
recipeList:
  - org.apache.camel.upgrade.customRecipes.ChangeComponentUriRecipe:
      uriPattern: "^minio:(.*?[?&])operation=getPartialObject(?=&|$)(.*)$"
      replacement: "minio:${1}operation=getObjectRange${2}"
  - org.openrewrite.java.ReplaceConstantWithAnotherConstant:
      existingFullyQualifiedConstantName: org.apache.camel.component.minio.MinioOperations.getPartialObject
      fullyQualifiedConstantName: org.apache.camel.component.minio.MinioOperations.getObjectRange
  - org.openrewrite.properties.ChangePropertyValue:
      propertyKey: camel.component.minio.operation
      oldValue: getPartialObject
      newValue: getObjectRange
  - org.openrewrite.yaml.ChangePropertyValue:
      propertyKey: camel.component.minio.operation
      oldValue: getPartialObject
      newValue: getObjectRange
---
