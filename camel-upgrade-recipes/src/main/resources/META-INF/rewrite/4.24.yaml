## https://github.com/apache/camel/blob/main/docs/user-manual/modules/ROOT/pages/camel-4x-upgrade-guide-4_24.adoc#camel-aws-bedrock-invokeimagemodelstreaming-and-invokeembeddingsmodelstreaming-are-deprecated
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel424.migrateBedrockNonStreamingOperations
displayName: Migrate the deprecated camel-aws-bedrock invokeImageModelStreaming and invokeEmbeddingsModelStreaming operations
description: >-
  The image and embedding models do not stream their response, so invokeImageModelStreaming and
  invokeEmbeddingsModelStreaming are deprecated in favour of invokeImageModel and invokeEmbeddingsModel. Renames the
  operation in endpoint URIs, the BedrockOperations enum constants and the camel.component.aws-bedrock.operation
  option. String values of the CamelAwsBedrockOperation header need a manual update.
preconditions:
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: org.apache.camel
      artifactIdPattern: camel-aws-bedrock
recipeList:
  - org.apache.camel.upgrade.customRecipes.ChangeComponentUriRecipe:
      uriPattern: "^aws-bedrock:(.*?[?&])operation=invokeImageModelStreaming(?=&|$)(.*)$"
      replacement: "aws-bedrock:${1}operation=invokeImageModel${2}"
  - org.apache.camel.upgrade.customRecipes.ChangeComponentUriRecipe:
      uriPattern: "^aws-bedrock:(.*?[?&])operation=invokeEmbeddingsModelStreaming(?=&|$)(.*)$"
      replacement: "aws-bedrock:${1}operation=invokeEmbeddingsModel${2}"
  - org.openrewrite.java.ReplaceConstantWithAnotherConstant:
      existingFullyQualifiedConstantName: org.apache.camel.component.aws2.bedrock.runtime.BedrockOperations.invokeImageModelStreaming
      fullyQualifiedConstantName: org.apache.camel.component.aws2.bedrock.runtime.BedrockOperations.invokeImageModel
  - org.openrewrite.java.ReplaceConstantWithAnotherConstant:
      existingFullyQualifiedConstantName: org.apache.camel.component.aws2.bedrock.runtime.BedrockOperations.invokeEmbeddingsModelStreaming
      fullyQualifiedConstantName: org.apache.camel.component.aws2.bedrock.runtime.BedrockOperations.invokeEmbeddingsModel
  - org.openrewrite.properties.ChangePropertyValue:
      propertyKey: camel.component.aws-bedrock.operation
      oldValue: invokeImageModelStreaming
      newValue: invokeImageModel
  - org.openrewrite.properties.ChangePropertyValue:
      propertyKey: camel.component.aws-bedrock.operation
      oldValue: invokeEmbeddingsModelStreaming
      newValue: invokeEmbeddingsModel
  - org.openrewrite.yaml.ChangePropertyValue:
      propertyKey: camel.component.aws-bedrock.operation
      oldValue: invokeImageModelStreaming
      newValue: invokeImageModel
  - org.openrewrite.yaml.ChangePropertyValue:
      propertyKey: camel.component.aws-bedrock.operation
      oldValue: invokeEmbeddingsModelStreaming
      newValue: invokeEmbeddingsModel
---
## https://github.com/apache/camel/blob/main/docs/user-manual/modules/ROOT/pages/camel-4x-upgrade-guide-4_24.adoc#camel-semantic-evaluation-only-auditing
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel424.removeSemanticAuditDecisionCalls
displayName: Remove the removed camel-semantic audit decision calls
description: >-
  CAMEL-25618: SemanticAudit (with get(context).decision(...)) and SemanticObserver.decision(...) are removed;
  evaluation auditing is automatic. Removes the calls. SemanticAuditDecision beans, overrides of SemanticObserver.decision and
  readers of the audit records need a manual update.
preconditions:
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: org.apache.camel
      artifactIdPattern: camel-semantic
recipeList:
  - org.openrewrite.java.RemoveMethodInvocations:
      methodPattern: org.apache.camel.semantic.SemanticAudit decision(..)
  # the class is removed: drop the SemanticAudit.get(context) statement left behind by the call removal
  - org.openrewrite.java.RemoveMethodInvocations:
      methodPattern: org.apache.camel.semantic.SemanticAudit get(..)
  - org.openrewrite.java.RemoveMethodInvocations:
      methodPattern: org.apache.camel.semantic.SemanticObserver decision(..)
---
