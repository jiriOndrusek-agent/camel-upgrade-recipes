## https://github.com/apache/camel/blob/main/docs/user-manual/modules/ROOT/pages/camel-4x-upgrade-guide-4_24.adoc#undertow-servlet-implementation
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel424.migrateUndertowServlet
displayName: Migrate io.undertow:undertow-servlet to io.undertow.ee:undertow-servlet
description: >-
  CAMEL-27030: camel-undertow uses the Jakarta Servlet 6.1 implementation of Undertow EE. A declared
  io.undertow:undertow-servlet dependency is changed to io.undertow.ee:undertow-servlet. Exclusions of the old
  artifact in other dependencies need a manual check.
preconditions:
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: org.apache.camel
      artifactIdPattern: camel-undertow
recipeList:
  - org.openrewrite.maven.ChangeDependencyGroupIdAndArtifactId:
      oldGroupId: io.undertow
      oldArtifactId: undertow-servlet
      newGroupId: io.undertow.ee
      newArtifactId: undertow-servlet
      newVersion: 2.0.3.Final
---
## https://github.com/apache/camel/blob/main/docs/user-manual/modules/ROOT/pages/camel-4x-upgrade-guide-4_24.adoc#bouncy-castle-1-87
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel424.migrateBouncyCastleLms
displayName: Migrate the Bouncy Castle LMS and XMSS classes used with camel-pqc
description: >-
  CAMEL-27309: Bouncy Castle 1.87 removed org.bouncycastle.pqc.crypto.lms.LMSigParameters and LMOtsParameters
  (now in org.bouncycastle.crypto.params) and deprecated the LMS and XMSS classes of org.bouncycastle.pqc.jcajce.spec
  and org.bouncycastle.pqc.jcajce.interfaces in favour of the same classes in org.bouncycastle.jcajce.spec and
  org.bouncycastle.jcajce.interfaces. LMSParameterSpec and LMSHSSParameterSpec have no new counterpart.
preconditions:
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: org.apache.camel
      artifactIdPattern: camel-pqc
recipeList:
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.bouncycastle.pqc.crypto.lms.LMSigParameters
      newFullyQualifiedTypeName: org.bouncycastle.crypto.params.LMSigParameters
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.bouncycastle.pqc.crypto.lms.LMOtsParameters
      newFullyQualifiedTypeName: org.bouncycastle.crypto.params.LMOtsParameters
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.bouncycastle.pqc.jcajce.spec.LMSKeyGenParameterSpec
      newFullyQualifiedTypeName: org.bouncycastle.jcajce.spec.LMSKeyGenParameterSpec
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.bouncycastle.pqc.jcajce.spec.LMSHSSKeyGenParameterSpec
      newFullyQualifiedTypeName: org.bouncycastle.jcajce.spec.LMSHSSKeyGenParameterSpec
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.bouncycastle.pqc.jcajce.spec.XMSSParameterSpec
      newFullyQualifiedTypeName: org.bouncycastle.jcajce.spec.XMSSParameterSpec
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.bouncycastle.pqc.jcajce.spec.XMSSMTParameterSpec
      newFullyQualifiedTypeName: org.bouncycastle.jcajce.spec.XMSSMTParameterSpec
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.bouncycastle.pqc.jcajce.interfaces.LMSKey
      newFullyQualifiedTypeName: org.bouncycastle.jcajce.interfaces.LMSKey
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.bouncycastle.pqc.jcajce.interfaces.LMSPrivateKey
      newFullyQualifiedTypeName: org.bouncycastle.jcajce.interfaces.LMSPrivateKey
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.bouncycastle.pqc.jcajce.interfaces.XMSSKey
      newFullyQualifiedTypeName: org.bouncycastle.jcajce.interfaces.XMSSKey
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.bouncycastle.pqc.jcajce.interfaces.XMSSPrivateKey
      newFullyQualifiedTypeName: org.bouncycastle.jcajce.interfaces.XMSSPrivateKey
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.bouncycastle.pqc.jcajce.interfaces.XMSSMTKey
      newFullyQualifiedTypeName: org.bouncycastle.jcajce.interfaces.XMSSMTKey
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.bouncycastle.pqc.jcajce.interfaces.XMSSMTPrivateKey
      newFullyQualifiedTypeName: org.bouncycastle.jcajce.interfaces.XMSSMTPrivateKey
---
