## https://github.com/apache/camel/blob/main/docs/user-manual/modules/ROOT/pages/camel-4x-upgrade-guide-4_24.adoc#camel-kubernetes-kubernetes-client-8
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel424.migrateKubernetesHttpClientExclusion
displayName: Migrate the exclusion of the fabric8 Vert.x HTTP client to kubernetes-httpclient-vertx-5
description: >-
  CAMEL-25031: the fabric8 Kubernetes client 8 uses kubernetes-httpclient-vertx-5. An exclusion of
  kubernetes-httpclient-vertx is renamed. The Jackson 3 changes need a manual migration.
preconditions:
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: org.apache.camel
      artifactIdPattern: camel-kubernetes
recipeList:
  - org.openrewrite.xml.ChangeTagValue:
      elementName: //exclusions/exclusion/artifactId
      oldValue: kubernetes-httpclient-vertx
      newValue: kubernetes-httpclient-vertx-5
---
