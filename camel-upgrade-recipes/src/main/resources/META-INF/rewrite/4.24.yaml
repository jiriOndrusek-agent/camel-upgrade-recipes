type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel424.migratePlc4xS7Light
displayName: Migrate plc4x:s7-light endpoints to plc4x:s7
description: >-
  CAMEL-25617: the S7 driver of PLC4X 1.0.0 no longer includes the s7-light driver. Renames the scheme; the renamed
  driver parameters and the tag address syntax need a manual update.
preconditions:
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: org.apache.camel
      artifactIdPattern: camel-plc4x
recipeList:
  - org.apache.camel.upgrade.customRecipes.ChangeComponentUriRecipe:
      uriPattern: "^plc4x:s7-light://(.*)$"
      replacement: "plc4x:s7://${1}"
---
