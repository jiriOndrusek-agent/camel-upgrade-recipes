## https://github.com/apache/camel/blob/main/docs/user-manual/modules/ROOT/pages/camel-4x-upgrade-guide-4_24.adoc#camel-rocketmq-the-headers-are-named-camelrocketmq-and-waitforsendresult-is-true-by-default
