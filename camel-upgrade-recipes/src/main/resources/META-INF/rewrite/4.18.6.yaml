#####
# Rules coming from https://camel.apache.org/manual/camel-4x-upgrade-guide-4_18.html
# Specifically changes introduced in 4.18.6 (upgrading from 4.18.5 to 4.18.6), checked against the camel-4.18.6 tag.
#
# The openstack Swift header rename also ships in Camel 4.22.3 and 4.24.0 (not in 4.23.0), so per
# RECIPE-CONVENTIONS.md the recipe lives here and the camel422_3 chain references it.
#####

#####
# Update the Camel project from 4.18.5 to 4.18.6
#####
---
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel418_6.CamelMigrationRecipe
displayName: Migrates `camel 4.18.5` application to `camel 4.18.6`
description: Migrates `camel 4.18.5` application to `camel 4.18.6`.
recipeList:
  - org.apache.camel.upgrade.camel418_6.upgradeOpenstackSwiftHeaders
---
## https://github.com/apache/camel/blob/main/docs/user-manual/modules/ROOT/pages/camel-4x-upgrade-guide-4_18.adoc#camel-openstack---the-remaining-swift-header-constants-follow-the-camel-naming-convention
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel418_6.upgradeOpenstackSwiftHeaders
displayName: Migrate the remaining camel-openstack Swift header names
description: >-
  CAMEL-25895: the SwiftConstants CONTAINER_METADATA_PREFIX, VERSIONS_LOCATION, CONTAINER_READ and CONTAINER_WRITE
  header values are renamed to CamelOpenstackSwift*. Renames the literal header names and the Endpoint DSL header
  name builder methods. Usages of the SwiftConstants fields need no change.
preconditions:
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: org.apache.camel
      artifactIdPattern: camel-openstack
recipeList:
  - org.apache.camel.upgrade.camel418_3.RenameHeaders:
      headerMappings:
        X-Container-Meta-: CamelOpenstackSwiftContainerMetadata
        X-Versions-Location: CamelOpenstackSwiftVersionsLocation
        X-Container-Read: CamelOpenstackSwiftContainerRead
        X-Container-Write: CamelOpenstackSwiftContainerWrite
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.camel.builder.endpoint.dsl.SwiftEndpointBuilderFactory.SwiftHeaderNameBuilder xContainerMeta()
      newMethodName: openstackSwiftContainerMetadata
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.camel.builder.endpoint.dsl.SwiftEndpointBuilderFactory.SwiftHeaderNameBuilder xVersionsLocation()
      newMethodName: openstackSwiftVersionsLocation
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.camel.builder.endpoint.dsl.SwiftEndpointBuilderFactory.SwiftHeaderNameBuilder xContainerRead()
      newMethodName: openstackSwiftContainerRead
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.camel.builder.endpoint.dsl.SwiftEndpointBuilderFactory.SwiftHeaderNameBuilder xContainerWrite()
      newMethodName: openstackSwiftContainerWrite
